name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/workbench-*', 'codex/github-pr-review']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Clean build
        run: mvn -B -ntp clean test
      - name: Incremental build
        run: mvn -B -ntp test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Production jar
        run: mvn -B -ntp -Pproduction clean package
      - name: Jar routes and database restart
        run: python3 scripts/workbench-smoke/jar_check.py
  web:
    name: Vue workbench
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run build
