spring:
  application:
    name: code-review-agent
  datasource:
    # SQLite 是进程内数据库。可用 REVIEW_DATABASE_PATH 指定持久化文件的绝对路径。
    url: jdbc:sqlite:${REVIEW_DATABASE_PATH:./review-records.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 同一时刻只有一个写事务，单连接可避免本服务内部争抢写锁。
      maximum-pool-size: 1
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  ai:
    retry:
      # 包含首次调用：临时连接故障最多再试五次，每次间隔 1、2、4、8、8 秒。
      max-attempts: 6
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 8s
    openai:
      # 也可用环境变量覆盖：OPENAI_API_KEY、OPENAI_BASE_URL、OPENAI_MODEL
      api-key: ${OPENAI_API_KEY:dev}
      # Spring AI 会在这个地址后拼接 /v1/chat/completions。
      # 使用官方 API 时填写根地址，不要重复添加 /v1。
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # 必须是该服务 /v1/models 里真实存在的模型名。
          # 不显式设置 temperature，沿用模型默认值。
          model: ${OPENAI_MODEL:gpt-6.1-sol}

# diff 未就绪时的重试。超过 max-attempts 后留下一条失败概览讨论。
review:
  github:
    repository: ${REVIEW_GITHUB_REPOSITORY:User0Xin/code-review-agent}
    repository-id: ${REVIEW_GITHUB_REPOSITORY_ID:1418627378}
    token: ${REVIEW_GITHUB_TOKEN:}
    webhook-secret: ${REVIEW_GITHUB_WEBHOOK_SECRET:}
  revision:
    new-findings-threshold: ${REVIEW_REVISION_N:20}
    minimum-group-size: ${REVIEW_REVISION_M:3}
  gitlab:
    base-url: ${GITLAB_BASE_URL:}
    token: ${GITLAB_TOKEN:}
    project-id: ${GITLAB_PROJECT_ID:0}
    request-timeout: 30s
  diff-wait:
    max-attempts: 3
    interval: 2s
  standards:
    branch: ""

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8088
